services:
  mysql:
    image: mysql:8.0
    container_name: sagae-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sagae_pnae
      MYSQL_USER: sagae
      MYSQL_PASSWORD: sagae123
    ports:
      - '3308:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  mysql-data:
